<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"/>
<meta name="theme-color" content="#0a0a0a"/>
<title>NimehuyTV — JIYYAD TOOLS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0a0a0a;--elev:#111;--card:#161616;--line:#242424;--line2:#333;
  --text:#f5f5f5;--muted:#9a9a9a;--faint:#555;
  --orange:#ff7a18;--orange2:#ff9a4a;--orange-dim:rgba(255,122,24,.14);
  --font:Inter,system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);--bounce:cubic-bezier(.34,1.35,.64,1);
  --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
*:focus{outline:none!important}
*:focus-visible{outline:2px solid var(--orange)!important;outline-offset:2px}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
img{display:block;max-width:100%}
button,input{font:inherit;color:inherit;background:none;border:none}
a{color:inherit;text-decoration:none}
::selection{background:var(--orange);color:#000}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.93)}100%{opacity:1;transform:none}}
@keyframes introLogo{0%{opacity:0;transform:scale(.7);filter:blur(12px)}60%{opacity:1;transform:scale(1.04);filter:blur(0)}100%{opacity:1;transform:scale(1);filter:none}}
@keyframes introText{from{opacity:0;letter-spacing:.4em}to{opacity:1;letter-spacing:.12em}}
@keyframes introBar{from{width:0;opacity:0}to{width:88px;opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 24px rgba(255,122,24,.15)}50%{box-shadow:0 0 40px rgba(255,122,24,.3)}}

.intro{position:fixed;inset:0;z-index:200;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .7s var(--ease),visibility .7s}
.intro.hide{opacity:0;visibility:hidden;pointer-events:none}
.intro-inner{text-align:center;padding:24px;position:relative}
.intro-glow{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,122,24,.28),transparent 70%);filter:blur(18px);animation:pulse 2.4s ease-in-out infinite}
.intro-logo{
  position:relative;width:88px;height:88px;margin:0 auto 16px;border-radius:22px;overflow:hidden;
  border:1px solid rgba(255,122,24,.35);background:#111;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:24px;color:var(--orange);animation:introLogo 1.05s var(--ease) forwards,glow 2.5s ease-in-out infinite 1s;
}
.intro-logo img{width:100%;height:100%;object-fit:contain}
.intro-name{font-size:22px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:0;animation:introText .9s var(--ease) .28s forwards}
.intro-name span{color:var(--orange)}
.intro-tag{margin-top:8px;font-size:12px;color:var(--muted);opacity:0;animation:fadeUp .55s var(--ease) .48s forwards}
.intro-bar{height:2px;margin:16px auto 0;background:linear-gradient(90deg,transparent,var(--orange),transparent);animation:introBar .8s var(--ease) .62s forwards}
.intro-dots{margin-top:14px;display:flex;gap:5px;justify-content:center;opacity:0;animation:fadeUp .45s var(--ease) .78s forwards}
.intro-dots i{width:5px;height:5px;border-radius:50%;background:var(--orange);animation:pulse 1s ease infinite}
.intro-dots i:nth-child(2){animation-delay:.15s}
.intro-dots i:nth-child(3){animation-delay:.3s}

.app{opacity:0;transition:opacity .5s;min-height:100vh;padding-bottom:calc(70px + var(--safe))}
.app.show{opacity:1}

.top{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;
  padding:10px 14px;background:rgba(10,10,10,.92);backdrop-filter:blur(14px);border-bottom:1px solid transparent;
}
.top.scrolled{border-bottom-color:var(--line)}
.brand{display:flex;align-items:center;gap:9px;cursor:pointer;flex-shrink:0}
.brand-mark{width:34px;height:34px;border-radius:10px;border:1px solid rgba(255,122,24,.3);background:#111;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px;color:var(--orange)}
.brand-mark img{width:100%;height:100%;object-fit:contain}
.brand h1{font-size:15px;font-weight:800;letter-spacing:-.2px}
.brand h1 span{color:var(--orange)}
.brand p{font-size:9px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.search{flex:1;position:relative;max-width:420px;margin-left:auto}
.search input{
  width:100%;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--elev);
  padding:0 38px 0 14px;font-size:13px;font-weight:600;
}
.search input:focus{border-color:rgba(255,122,24,.5);box-shadow:0 0 0 3px var(--orange-dim)}
.search svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted);pointer-events:none}

.hero{position:relative;min-height:42vh;display:flex;align-items:flex-end;overflow:hidden;animation:fadeIn .55s var(--ease)}
.hero-bg{position:absolute;inset:0}
.hero-bg img{width:100%;height:100%;object-fit:cover;opacity:.45}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,10,.25),rgba(10,10,10,.7) 55%,var(--bg)),linear-gradient(90deg,rgba(10,10,10,.85),transparent 60%)}
.hero-body{position:relative;z-index:1;padding:20px 14px 24px;max-width:560px;animation:fadeUp .55s var(--ease) .08s both}
.hero-badge{font-size:11px;font-weight:750;color:var(--orange);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.hero h2{font-size:clamp(22px,5vw,34px);font-weight:800;letter-spacing:-.6px;line-height:1.1;margin-bottom:8px}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;font-weight:650;color:var(--muted);margin-bottom:8px}
.hero p{font-size:13px;line-height:1.5;color:#cfcfcf;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:12px}
.btn{
  height:40px;padding:0 14px;border-radius:10px;font-size:13px;font-weight:750;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;
  transition:transform .15s var(--bounce),background .2s;
}
.btn:active{transform:scale(.97)}
.btn-main{background:var(--orange);color:#111}
.btn-ghost{background:rgba(255,255,255,.08);border:1px solid var(--line);color:#fff}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap}

.section{padding:8px 0 2px;animation:fadeUp .5s var(--ease) both}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:0 14px 10px}
.section-head h3{font-size:14px;font-weight:750}
.row{display:flex;gap:10px;overflow-x:auto;padding:0 14px 12px;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.row::-webkit-scrollbar{display:none}
.card{flex:0 0 auto;width:118px;scroll-snap-align:start;cursor:pointer;animation:pop .4s var(--bounce) both;transition:transform .2s var(--ease)}
.card:hover{transform:translateY(-3px)}
.card-cover{aspect-ratio:2/3;border-radius:12px;overflow:hidden;background:var(--card);border:1px solid var(--line);position:relative}
.card-cover img{width:100%;height:100%;object-fit:cover}
.card-cover .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--faint)}
.card-title{margin-top:6px;font-size:11.5px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-sub{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:2px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:12px;padding:0 14px 16px}
.panel{display:none}
.panel.on{display:block;animation:fadeUp .35s var(--ease)}
.empty{text-align:center;padding:40px 16px;color:var(--muted);font-size:13px;font-weight:600}

.overlay{position:fixed;inset:0;z-index:70;background:var(--bg);display:none;flex-direction:column;overflow:auto}
.overlay.on{display:flex;animation:fadeIn .28s var(--ease)}
.ov-bar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(10,10,10,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--elev);display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn svg{width:17px;height:17px}
.ov-bar h3{flex:1;font-size:13.5px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.player-wrap{background:#000;aspect-ratio:16/9;width:100%;max-height:56vh;position:relative}
.player-wrap video,.player-wrap iframe{width:100%;height:100%;border:0;display:block;background:#000}
.player-wrap .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--muted);background:#000}
.servers{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;scrollbar-width:none}
.servers::-webkit-scrollbar{display:none}
.srv{flex:0 0 auto;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--elev);font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer}
.srv.on{background:var(--orange-dim);border-color:var(--orange);color:var(--orange2)}

.detail-body{padding:14px}
.detail-body h2{font-size:18px;font-weight:800;margin-bottom:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{font-size:10.5px;font-weight:700;padding:4px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--elev)}
.ov{font-size:13px;line-height:1.5;color:#cfcfcf;margin-bottom:12px}
.ep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.ep{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--elev);font-size:12px;font-weight:750;cursor:pointer;color:var(--muted)}
.ep.on{background:var(--orange);border-color:var(--orange);color:#111}

.bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;padding:8px 6px calc(8px + var(--safe));background:rgba(10,10,10,.96);border-top:1px solid var(--line);backdrop-filter:blur(12px)}
.bottom button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;color:var(--muted);padding:4px;cursor:pointer}
.bottom button.on{color:var(--orange)}
.bottom svg{width:20px;height:20px}

.loading{display:flex;justify-content:center;padding:40px}
.spin{width:22px;height:22px;border:2px solid var(--line2);border-top-color:var(--orange);border-radius:50%;animation:spin .65s linear infinite}
.toast{position:fixed;left:50%;bottom:calc(78px + var(--safe));transform:translateX(-50%) translateY(8px);background:#fff;color:#000;padding:10px 14px;border-radius:999px;font-size:12.5px;font-weight:750;opacity:0;pointer-events:none;transition:.25s;z-index:100}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media(min-width:768px){
  .card{width:148px}
  .hero{min-height:56vh}
  .hero-body,.section-head,.row,.detail-body,.servers,.grid{padding-left:28px;padding-right:28px}
  .top{padding-left:28px;padding-right:28px}
  .bottom{display:none}
  .app{padding-bottom:24px}
  .player-wrap{max-height:70vh}
}
</style>
</head>
<body>
<div class="intro" id="intro">
  <div class="intro-inner">
    <div class="intro-glow"></div>
    <div class="intro-logo"><img src="logo-jiyyad.png" alt="" onerror="this.remove();this.parentElement.textContent='NH'"/></div>
    <div class="intro-name">NIME<span>HUY</span>TV</div>
    <div class="intro-tag">JIYYAD TOOLS · anime streaming premium</div>
    <div class="intro-bar"></div>
    <div class="intro-dots"><i></i><i></i><i></i></div>
  </div>
</div>

<div class="app" id="app">
  <header class="top" id="top">
    <div class="brand" id="goHome">
      <div class="brand-mark"><img src="logo-jiyyad.png" alt="" onerror="this.parentElement.textContent='NH'"/></div>
      <div>
        <h1>Nime<span>huy</span>TV</h1>
        <p>Jiyyad Tools</p>
      </div>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="Cari anime..." autocomplete="off"/>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </div>
  </header>

  <div id="homeView">
    <section class="hero" id="hero">
      <div class="hero-bg"><img id="heroImg" alt=""/></div>
      <div class="hero-body">
        <div class="hero-badge">✦ Featured</div>
        <h2 id="heroTitle">Memuat…</h2>
        <div class="hero-meta" id="heroMeta"></div>
        <p id="heroOv"></p>
        <div class="hero-actions">
          <button class="btn btn-main" id="heroPlay" type="button">▶ Tonton</button>
          <button class="btn btn-ghost" id="heroInfo" type="button">Detail</button>
        </div>
      </div>
    </section>
    <section class="section" style="animation-delay:.06s"><div class="section-head"><h3>Hot</h3></div><div class="row" id="rowHot"><div class="loading"><div class="spin"></div></div></div></section>
    <section class="section" style="animation-delay:.1s"><div class="section-head"><h3>Baru</h3></div><div class="row" id="rowNew"><div class="loading"><div class="spin"></div></div></div></section>
    <section class="section" style="animation-delay:.14s"><div class="section-head"><h3>Populer</h3></div><div class="row" id="rowPopular"><div class="loading"><div class="spin"></div></div></div></section>
  </div>

  <div class="panel" id="searchView">
    <div class="section-head"><h3 id="searchLabel">Hasil</h3></div>
    <div class="grid" id="searchGrid"></div>
    <div class="empty" id="searchEmpty" style="display:none">Tidak ada hasil</div>
  </div>
</div>

<div class="overlay" id="watch">
  <div class="ov-bar">
    <button class="icon-btn" id="closeWatch" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h3 id="watchTitle">—</h3>
  </div>
  <div class="player-wrap" id="player"><div class="ph"><div class="spin"></div><div>Pilih episode</div></div></div>
  <div class="servers" id="servers"></div>
  <div class="detail-body">
    <h2 id="dTitle">—</h2>
    <div class="meta" id="dMeta"></div>
    <p class="ov" id="dOv"></p>
    <div style="font-size:12px;font-weight:800;color:var(--muted);margin-bottom:8px">EPISODE</div>
    <div class="ep-grid" id="epGrid"></div>
  </div>
</div>

<nav class="bottom">
  <button type="button" class="on" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5z"/></svg>Beranda</button>
  <button type="button" data-tab="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>Cari</button>
  <button type="button" data-tab="hot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3c2 3 5 4.5 5 8a5 5 0 1 1-10 0c0-2 1-3.5 2-5 1 2 2 2.5 3 2z"/></svg>Hot</button>
</nav>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
let home = {};
let featured = null;
let currentAnime = null;
let currentEps = [];
let streamData = null;
let searchTimer = null;

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._);toast._=setTimeout(()=>t.classList.remove('on'),2000)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function cardHTML(a, delay=0){
  if(!a||!a.id) return '';
  return `<div class="card" style="animation-delay:${delay}s" data-id="${esc(a.id)}">
    <div class="card-cover">${a.poster?`<img src="${esc(a.poster)}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<div class=ph>No Poster</div>'"/>`:'<div class="ph">No Poster</div>'}</div>
    <div class="card-title">${esc(a.title)}</div>
    <div class="card-sub">${esc([a.type,a.year].filter(Boolean).join(' · '))}</div>
  </div>`;
}
function bindCards(root){
  root.querySelectorAll('.card').forEach(el=>el.onclick=()=>openWatch(el.dataset.id));
}

async function loadHome(){
  try{
    const r = await fetch('/api/home');
    const d = await r.json();
    if(!d.status) throw new Error(d.error||'Gagal');
    home = d;
    featured = (d.hot&&d.hot[0]) || (d.popular&&d.popular[0]) || (d.new&&d.new[0]);
    renderHero();
    $('#rowHot').innerHTML = (d.hot||[]).map((x,i)=>cardHTML(x,i*0.02)).join('')||'<div class="empty">Kosong</div>';
    $('#rowNew').innerHTML = (d.new||[]).map((x,i)=>cardHTML(x,i*0.02)).join('')||'<div class="empty">Kosong</div>';
    $('#rowPopular').innerHTML = (d.popular||[]).map((x,i)=>cardHTML(x,i*0.02)).join('')||'<div class="empty">Kosong</div>';
    bindCards($('#rowHot')); bindCards($('#rowNew')); bindCards($('#rowPopular'));
  }catch(e){
    $('#rowHot').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}
function renderHero(){
  if(!featured) return;
  $('#heroImg').src = featured.cover || featured.poster || '';
  $('#heroTitle').textContent = featured.title || '—';
  $('#heroMeta').innerHTML = [featured.type,featured.year,featured.status].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join('');
  $('#heroOv').textContent = featured.synopsis || '';
  $('#heroPlay').onclick = ()=> openWatch(featured.id);
  $('#heroInfo').onclick = ()=> openWatch(featured.id);
}

async function openWatch(id){
  $('#watch').classList.add('on');
  $('#watchTitle').textContent = 'Memuat…';
  $('#player').innerHTML = '<div class="ph"><div class="spin"></div><div>Memuat…</div></div>';
  $('#servers').innerHTML = '';
  $('#epGrid').innerHTML = '';
  try{
    const r = await fetch('/api/detail/'+id);
    const d = await r.json();
    if(!d.status) throw new Error(d.error||'Gagal');
    currentAnime = d.anime;
    currentEps = d.episodes || [];
    $('#watchTitle').textContent = currentAnime.title || '—';
    $('#dTitle').textContent = currentAnime.title || '—';
    $('#dMeta').innerHTML = [
      currentAnime.type, currentAnime.year, currentAnime.status, ...(currentAnime.genre||[]).slice(0,4)
    ].filter(Boolean).map(x=>`<span class="chip">${esc(x)}</span>`).join('');
    $('#dOv').textContent = currentAnime.synopsis || 'Tidak ada sinopsis.';
    // sort episodes ascending by index
    currentEps = [...currentEps].sort((a,b)=>(Number(a.index)||0)-(Number(b.index)||0));
    $('#epGrid').innerHTML = currentEps.map(ep=>`
      <button type="button" class="ep" data-eid="${esc(ep.id)}">${esc(ep.index||'?')}</button>
    `).join('') || '<div class="empty">Belum ada episode</div>';
    $('#epGrid').querySelectorAll('.ep').forEach(btn=>{
      btn.onclick = ()=> playEpisode(btn.dataset.eid, btn);
    });
    if(currentEps.length){
      const last = currentEps[currentEps.length-1];
      const btn = $('#epGrid').querySelector(`[data-eid="${last.id}"]`);
      playEpisode(last.id, btn);
    } else {
      $('#player').innerHTML = '<div class="ph">Tidak ada episode</div>';
    }
  }catch(e){ toast(e.message||'Error'); }
}

async function playEpisode(eid, btn){
  $$('#epGrid .ep').forEach(b=>b.classList.remove('on'));
  if(btn) btn.classList.add('on');
  $('#player').innerHTML = '<div class="ph"><div class="spin"></div><div>Memuat stream…</div></div>';
  $('#servers').innerHTML = '';
  try{
    const r = await fetch('/api/stream/'+eid);
    const d = await r.json();
    if(!d.status) throw new Error(d.error||'Gagal stream');
    streamData = d;
    const list = [...(d.direct||[]), ...(d.embed||[])];
    if(!list.length){
      $('#player').innerHTML = '<div class="ph">Server tidak tersedia</div>';
      return;
    }
    $('#servers').innerHTML = list.map((s,i)=>`
      <button type="button" class="srv ${i===0?'on':''}" data-i="${i}">${esc(s.name||'Server')} ${esc(s.quality||'')}</button>
    `).join('');
    $('#servers').querySelectorAll('.srv').forEach(b=>{
      b.onclick = ()=>{
        $$('#servers .srv').forEach(x=>x.classList.remove('on'));
        b.classList.add('on');
        setServer(list[+b.dataset.i]);
      };
    });
    setServer(list[0]);
  }catch(e){
    $('#player').innerHTML = `<div class="ph">${esc(e.message)}</div>`;
  }
}
function setServer(s){
  if(!s||!s.link) return;
  const link = s.link;
  if(s.type==='direct' || /\.mp4/i.test(link)){
    $('#player').innerHTML = `<video src="${esc(link)}" controls autoplay playsinline></video>`;
  } else {
    $('#player').innerHTML = `<iframe src="${esc(link)}" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="no-referrer"></iframe>`;
  }
}

$('#closeWatch').onclick = ()=>{
  $('#watch').classList.remove('on');
  $('#player').innerHTML = '';
};
$('#goHome').onclick = ()=> showTab('home');

function showTab(tab){
  $$('.bottom button').forEach(b=>b.classList.toggle('on', b.dataset.tab===tab));
  if(tab==='home'){
    $('#homeView').style.display='block';
    $('#searchView').classList.remove('on');
  } else if(tab==='search'){
    $('#homeView').style.display='none';
    $('#searchView').classList.add('on');
    $('#q').focus();
  } else if(tab==='hot'){
    $('#homeView').style.display='none';
    $('#searchView').classList.add('on');
    $('#searchLabel').textContent = 'Hot Anime';
    $('#searchGrid').innerHTML = (home.hot||[]).map((x,i)=>cardHTML(x,i*0.02)).join('');
    bindCards($('#searchGrid'));
    $('#searchEmpty').style.display = (home.hot||[]).length?'none':'block';
  }
}
$$('.bottom button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));

$('#q').addEventListener('input', ()=>{
  clearTimeout(searchTimer);
  const q = $('#q').value.trim();
  if(!q){ showTab('home'); return; }
  searchTimer = setTimeout(async ()=>{
    showTab('search');
    $('#searchLabel').textContent = `Hasil: “${q}”`;
    $('#searchGrid').innerHTML = '<div class="loading"><div class="spin"></div></div>';
    try{
      const r = await fetch('/api/search?q='+encodeURIComponent(q));
      const d = await r.json();
      const list = d.results||[];
      $('#searchGrid').innerHTML = list.map((x,i)=>cardHTML(x,i*0.02)).join('');
      bindCards($('#searchGrid'));
      $('#searchEmpty').style.display = list.length?'none':'block';
    }catch(e){
      $('#searchGrid').innerHTML='';
      $('#searchEmpty').style.display='block';
      $('#searchEmpty').textContent=e.message;
    }
  }, 350);
});

window.addEventListener('scroll',()=>$('#top').classList.toggle('scrolled', scrollY>12),{passive:true});

setTimeout(()=>{
  $('#intro').classList.add('hide');
  $('#app').classList.add('show');
  setTimeout(()=>{$('#intro').style.display='none'},750);
  loadHome();
}, 2600);
</script>
</body>
</html>
